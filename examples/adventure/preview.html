<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STEM Adventure</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#141414;color:#e6e2d8;font:16px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}
main{max-width:820px;margin:auto;padding:24px}
h1{font:700 24px/1.25 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.025em;text-transform:uppercase;margin:0 0 14px}
p{margin:10px 0}.muted{color:#b8b8b8;font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}
.arcade-mark{font-size:12px;letter-spacing:.12em;color:#bcb6a7;border-top:3px double #777;padding-top:12px;margin:0 0 18px}
#status{font-size:14px;color:#ccc;border-block:1px solid #555;padding:7px 0}
#log{white-space:pre-wrap;overflow-wrap:anywhere;border-bottom:3px double #666;margin:18px 0;padding-bottom:16px;max-height:360px;overflow:auto}
.entry{margin:0 0 18px}.command{color:#aaa}.result{white-space:pre-wrap}
.command-entry{display:flex;align-items:center;gap:10px;border:1px solid #666;background:#1b1b1b;padding-left:12px}
input{min-width:0;flex:1;background:transparent;color:inherit;border:0;padding:10px 0;font:inherit;min-height:44px}
button{background:#252525;color:inherit;border:0;border-left:1px solid #555;border-radius:0;width:44px;min-height:44px;font:700 22px ui-monospace,SFMono-Regular,Consolas,monospace;cursor:pointer}
button:hover{background:#333}button:focus-visible,input:focus-visible{outline:2px solid white;outline-offset:2px}
#notice{color:#ccc;white-space:pre-wrap;overflow-wrap:anywhere}#notice:empty{display:none}.hint{font-size:12px;color:#999;margin-top:8px}
details{margin-top:16px}textarea{width:100%;min-height:150px;background:#202020;color:#ddd;font:13px/1.5 monospace;border:1px solid #555;padding:10px}
@media(max-width:480px){main{padding:16px}h1{font-size:22px}.arcade-mark{letter-spacing:.04em}}
</style>
</head>
<body><main>
<div class="arcade-mark" aria-hidden="true">░▒▓ STEM / TEXT ADVENTURE ▓▒░</div>
<h1 id="title"></h1><p id="intro" class="muted"></p><p id="status" aria-live="polite"></p>
<div id="log" role="log" aria-label="Game transcript"></div>
<div class="command-entry"><label for="command" aria-hidden="true">❯</label><input id="command" aria-label="Game command" placeholder="Enter command" autocomplete="off" maxlength="120"><button id="enter" type="button" aria-label="Enter command">↵</button></div>
<p class="hint">Type help for commands.</p><p id="notice" role="status"></p>
<input id="file" type="file" accept=".json,application/json" hidden>
<details id="record-panel" hidden><summary>Copy play record</summary><textarea id="record" readonly aria-label="Play record"></textarea></details>
</main>
<script>/* Deterministic text-adventure engine. No network, storage, or dynamic code. */
(function (root) {
  'use strict';
  function validate(s) {
    if (!s || typeof s !== 'object' || Array.isArray(s)) throw Error('Scenario must be an object.');
    for (const key of ['title', 'introduction', 'start']) if (typeof s[key] !== 'string' || !s[key].trim() || s[key].length > 3000) throw Error('Invalid ' + key + '.');
    if (!s.rooms || typeof s.rooms !== 'object' || Array.isArray(s.rooms)) throw Error('Rooms are required.');
    const ids = Object.keys(s.rooms);
    if (ids.length < 2 || ids.length > 12 || !ids.includes(s.start)) throw Error('Use 2–12 rooms and a valid start.');
    const items = new Set();
    for (const id of ids) {
      if (!/^[a-z][a-z0-9_-]{0,39}$/.test(id)) throw Error('Invalid room ID.');
      const r = s.rooms[id];
      if (!r || typeof r.name !== 'string' || typeof r.description !== 'string' || !r.name.trim() || !r.description.trim() || r.name.length > 100 || r.description.length > 3000) throw Error('Invalid room text.');
      if (!r.exits || typeof r.exits !== 'object' || Array.isArray(r.exits)) throw Error('Invalid exits.');
      for (const [direction, target] of Object.entries(r.exits)) if (!['north','south','east','west','up','down'].includes(direction) || !ids.includes(target)) throw Error('Invalid exit.');
      if (!Array.isArray(r.items) || r.items.length > 12) throw Error('Invalid items.');
      for (const item of r.items) {
        if (typeof item !== 'string' || !/^[a-z][a-z -]{0,39}$/.test(item) || items.has(item)) throw Error('Items need unique, plain names.');
        items.add(item);
      }
    }
    if (!Array.isArray(s.actions) || s.actions.length < 1 || s.actions.length > 30) throw Error('Use 1–30 actions.');
    const commands = new Set(), flags = new Set();
    for (const a of s.actions) {
      if (!a || typeof a.command !== 'string' || !/^[a-z][a-z -]{1,59}$/.test(a.command) || /^(go |take |look$|inventory$|help$|undo$|restart$|save$|load$|discuss$)/.test(a.command) || commands.has(a.command)) throw Error('Invalid or duplicate action command.');
      commands.add(a.command);
      if (!ids.includes(a.room) || typeof a.text !== 'string' || !a.text.trim() || a.text.length > 3000) throw Error('Invalid action.');
      for (const k of ['requires_items','requires_flags','sets_flags','clears_flags']) {
        if (!Array.isArray(a[k]) || a[k].length > 20 || a[k].some(x => typeof x !== 'string' || !/^[a-z][a-z0-9_ -]{0,39}$/.test(x))) throw Error('Invalid action condition.');
      }
      if (a.requires_items.some(x => !items.has(x))) throw Error('Action refers to an unknown item.');
      a.sets_flags.forEach(x => flags.add(x));
    }
    if (!Array.isArray(s.goal_flags) || !s.goal_flags.length || s.goal_flags.length > 20 || s.goal_flags.some(x => !flags.has(x))) throw Error('Goal needs reachable flag names.');
    for (const a of s.actions) if (a.requires_flags.concat(a.clears_flags).some(x => !flags.has(x))) throw Error('Unknown flag condition.');
    const seen = new Set([s.start]), queue = [s.start];
    while (queue.length) for (const next of Object.values(s.rooms[queue.shift()].exits)) if (!seen.has(next)) {seen.add(next); queue.push(next);}
    if (seen.size !== ids.length) throw Error('Every room must be reachable from start.');
    return s;
  }
  function create(s) {
    validate(s);
    return {room:s.start, inventory:[], flags:[], taken:[], commands:[], events:[], complete:false};
  }
  function describe(s, state) {
    const r=s.rooms[state.room], items=r.items.filter(x=>!state.taken.includes(x));
    return r.name+'\n'+r.description+'\nExits: '+Object.keys(r.exits).join(', ')+(items.length?'\nYou see: '+items.join(', '):'');
  }
  function act(s, old, input) {
    const state=JSON.parse(JSON.stringify(old));
    let command=String(input).trim().toLowerCase().replace(/\s+/g,' '), text='', valid=true;
    const aliases={n:'go north',s:'go south',e:'go east',w:'go west',u:'go up',d:'go down',i:'inventory',l:'look'};
    command=Object.hasOwn(aliases,command)?aliases[command]:command;
    if (command==='look') text=describe(s,state);
    else if (command==='inventory') text='Inventory: '+(state.inventory.join(', ')||'empty');
    else if (command==='help') {const actions=s.actions.filter(a=>a.room===state.room).map(a=>a.command);text='look · inventory · go [direction] · take [item]\nundo — reverse one move\nrestart — begin again\nsave — download play record\nload — restore saved record\ndiscuss — place record in chat'+(actions.length?'\n\nActions here: '+actions.join(', '):'');}
    else if (command.startsWith('go ')) {
      const exits=s.rooms[state.room].exits, direction=command.slice(3);
      const target=Object.hasOwn(exits,direction)?exits[direction]:null;
      if (!target) {valid=false;text='No exit in that direction.';}
      else {state.room=target;text=describe(s,state);}
    } else if (command.startsWith('take ')) {
      const item=command.slice(5);
      if (!s.rooms[state.room].items.includes(item)||state.taken.includes(item)) {valid=false;text='That item is not here.';}
      else {state.inventory.push(item);state.taken.push(item);text='Taken: '+item+'.';}
    } else {
      const a=s.actions.find(a=>a.command===command&&a.room===state.room);
      if (!a) {valid=false;text='Unknown action here. Type help to see available commands.';}
      else if (a.requires_items.some(x=>!state.inventory.includes(x))) {valid=false;text='You need: '+a.requires_items.filter(x=>!state.inventory.includes(x)).join(', ')+'.';}
      else if (a.requires_flags.some(x=>!state.flags.includes(x))) {valid=false;text='Conditions are not ready. Examine earlier observations or try another action.';}
      else {
        state.flags=state.flags.filter(x=>!a.clears_flags.includes(x));
        for (const f of a.sets_flags) if (!state.flags.includes(f)) state.flags.push(f);
        text=a.text;
      }
    }
    state.complete=s.goal_flags.every(x=>state.flags.includes(x));
    state.commands.push(command);
    state.events.push({turn:state.commands.length,command,valid,room:state.room,text,flags:[...state.flags],inventory:[...state.inventory],complete:state.complete});
    return state;
  }
  function replay(s,commands) {
    if (!Array.isArray(commands)||commands.length>300||commands.some(c=>typeof c!=='string'||c.length>120)) throw Error('Invalid play record.');
    return commands.reduce((state,c)=>act(s,state,c),create(s));
  }
  root.Adventure={validate,create,describe,act,replay};
  if (typeof module!=='undefined'&&module.exports) module.exports=root.Adventure;
})(typeof globalThis!=='undefined'?globalThis:this);
</script>
<script>
'use strict';
let scenario={"title": "Prism Laboratory", "introduction": "Enter a fictional laboratory inspired by Newton\u2019s prism experiments. Investigate light, then compare observations with historical sources.", "start": "study", "rooms": {"study": {"name": "Study", "description": "A notebook asks whether a prism creates colours or separates light. A storeroom lies north; a dark laboratory lies east.", "exits": {"north": "storeroom", "east": "laboratory"}, "items": []}, "storeroom": {"name": "Storeroom", "description": "A glass prism and a screen with a narrow opening rest on a shelf.", "exits": {"south": "study"}, "items": ["prism", "screen"]}, "laboratory": {"name": "Laboratory", "description": "A shutter controls a narrow beam of sunlight. A pale wall faces the window. You can open or close the shutter, use a prism and screen, test red light, and record a result.", "exits": {"west": "study"}, "items": []}}, "actions": [{"command": "open shutter", "room": "laboratory", "requires_items": [], "requires_flags": [], "sets_flags": ["beam"], "clears_flags": [], "text": "A narrow beam of sunlight crosses the dark room and reaches the wall."}, {"command": "close shutter", "room": "laboratory", "requires_items": [], "requires_flags": [], "sets_flags": [], "clears_flags": ["beam", "spectrum", "red_selected", "red_tested", "recorded"], "text": "The shutter closes. The beam and visible spectrum disappear. Reopen it to repeat the experiment."}, {"command": "use prism", "room": "laboratory", "requires_items": ["prism"], "requires_flags": ["beam"], "sets_flags": ["spectrum"], "clears_flags": [], "text": "You place the prism in the beam. An elongated band of colours appears on the wall. This observation alone does not settle whether the prism creates or separates colours."}, {"command": "use screen", "room": "laboratory", "requires_items": ["screen"], "requires_flags": ["spectrum"], "sets_flags": ["red_selected"], "clears_flags": [], "text": "The screen's opening isolates red light from the coloured band. You can test how that selected light behaves under further refraction."}, {"command": "test red light", "room": "laboratory", "requires_items": ["prism"], "requires_flags": ["red_selected", "beam"], "sets_flags": ["red_tested"], "clears_flags": [], "text": "In this simplified repeat of the experiment, selected red light is refracted again and remains red. Compare this result with Newton's account before interpreting it."}, {"command": "record result", "room": "laboratory", "requires_items": [], "requires_flags": ["red_tested"], "sets_flags": ["recorded"], "clears_flags": [], "text": "Recorded: sunlight formed a spectrum, selected red light remained red after further refraction. The game is complete. Export your record to examine the procedure, failed actions, and interpretation."}], "goal_flags": ["recorded"]}, state=Adventure.create(scenario);
const byId=id=>document.getElementById(id);
function recordJSON(){return JSON.stringify({version:1,scenario,commands:state.commands,result:{room:state.room,inventory:state.inventory,flags:state.flags,complete:state.complete},events:state.events},null,2)}
function render(){
 byId('title').textContent='▣ '+scenario.title;byId('intro').textContent=scenario.introduction;
 byId('status').textContent='◉ '+scenario.rooms[state.room].name+' · Moves: '+state.commands.length+' · '+(state.complete?'Complete':'In progress');
 byId('log').replaceChildren();const first=document.createElement('p');first.className='entry';first.textContent=Adventure.describe(scenario,Adventure.create(scenario));byId('log').append(first);
 for(const e of state.events){const item=document.createElement('div'),c=document.createElement('div'),result=document.createElement('div');item.className='entry';c.className='command';c.textContent='❯ '+e.command;result.className='result';result.textContent=e.text;item.append(c,result);byId('log').append(item)}
 byId('log').scrollTop=byId('log').scrollHeight;byId('record').value=recordJSON();reportHeight();
}
function saveRecord(){const blob=new Blob([recordJSON()],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='stem-adventure-record.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);byId('notice').textContent='Game saved. Type load to restore this record.'}
function discussRecord(){
 parent.postMessage({type:'input:prompt',text:'Review this STEM Adventure play record. Identify a failed action, explain its prerequisite, and distinguish scripted observations from historical evidence.\n\n'+recordJSON()},'*');
 byId('notice').textContent=parent===window?'Copy your play record into Sandbox to discuss this run.':'Review your play record in chat, then send it. Copy it below if needed.';byId('record-panel').hidden=false;
}
function run(raw){
 const command=raw.trim().toLowerCase().replace(/\s+/g,' ');if(!command)return;
 byId('notice').textContent='';byId('command').value='';
 if(command==='undo'){state=Adventure.replay(scenario,state.commands.slice(0,-1));render();byId('notice').textContent='Previous move undone.'}
 else if(command==='restart'){state=Adventure.create(scenario);byId('record-panel').hidden=true;render();byId('notice').textContent='Game restarted.'}
 else if(command==='save')saveRecord();
 else if(command==='load')byId('file').click();
 else if(command==='discuss')discussRecord();
 else if(state.commands.length>=300)byId('notice').textContent='Type save to keep this run, then restart.';
 else {state=Adventure.act(scenario,state,command);render()}
 byId('command').focus();reportHeight();
}
byId('enter').onclick=()=>run(byId('command').value);
byId('command').addEventListener('keydown',e=>{if(e.key==='Enter')e.preventDefault()});
byId('command').addEventListener('keyup',e=>{if(e.key==='Enter'){e.preventDefault();run(e.currentTarget.value)}});
byId('file').onchange=async()=>{try{const f=byId('file').files[0];if(!f)return;if(f.size>200000)throw Error('Record exceeds 200 KB.');const record=JSON.parse(await f.text());if(record.version!==1)throw Error('Unsupported record version.');const next=Adventure.validate(record.scenario),restored=Adventure.replay(next,record.commands);scenario=next;state=restored;render();byId('notice').textContent='Game loaded by replaying saved commands.'}catch(e){byId('notice').textContent='Could not load game. '+e.message}byId('file').value='';reportHeight()};
function reportHeight(){parent.postMessage({type:'iframe:height',height:document.documentElement.scrollHeight},'*')}
window.addEventListener('load',reportHeight);new ResizeObserver(reportHeight).observe(document.body);render();
</script></body></html>
