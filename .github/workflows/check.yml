name: Check workshops
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 scripts/check_series.py
      - run: node --check js/deck-engine.js
      - run: node --check js/lightbox.js
      - run: node --check js/examples.js
      - run: git diff --check
