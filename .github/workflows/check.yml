name: Check workshops
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 scripts/check_series.py
      - run: python3 scripts/check_screenshot_resolution.py
      - run: python3 scripts/test_copy_regressions.py
      - run: node scripts/test_deck_interactions.cjs
      - run: node scripts/test_domain_warp.cjs
      - run: node --check js/domain-warp.js
      - run: node --check js/deck-engine.js
      - run: node --check js/lightbox.js
      - run: node --check js/examples.js
      - run: node examples/adventure/test-engine.cjs
      - run: python3 examples/adventure/test-validation.py
      - run: python3 examples/creators/test_record_validator.py
      - run: python3 -m py_compile examples/tools/stem_adventure.py
      - run: python3 examples/adventure/build_tool.py
      - run: git diff --exit-code -- examples/tools/stem_adventure.py examples/adventure/preview.html
      - run: git diff --check
